name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Pemeriksaan gaya kode (informasional dulu — codebase belum sepenuhnya diformat).
      # Setelah `./vendor/bin/pint` dijalankan sekali untuk seluruh repo, hapus
      # `continue-on-error` agar style menjadi gerbang wajib.
      - name: Check code style (Pint)
        continue-on-error: true
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test
        env:
          # Test memakai SQLite in-memory (lihat phpunit.xml) — tidak butuh MySQL
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
